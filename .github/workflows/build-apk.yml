name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: client/package-lock.json

      - name: Setup Java JDK 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Application
        run: |
          cd client
          npm install
          npm run build

      - name: Setup Capacitor and Sync Android
        run: |
          cd client
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Field Tracker" "com.fieldtracker.app" --web-dir dist || true
          [ -d "android" ] || npx cap add android || true
          npx cap sync android

      - name: Compile Android Debug APK
        run: |
          cd client/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldTracker-App
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
